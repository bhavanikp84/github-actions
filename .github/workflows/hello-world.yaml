
name: Hello World Workflow
run-name: added event in workflow

on:
  push:
    branches:
      - main
      - "example-branch/*"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  #workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight
  
env:
   WORKFLOW_VAR: I_AM_WORKFLOW_SCOPED

jobs:
  job1:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: I_AM_JOB_SCOPED
    steps:
      - name: echo
        run: echo "Hello, World!"
      - name: script
        run: print("Hello, World!")
        shell: python
      - name: echo env var
        run: |
          echo "Workflow scoped variable: $WORKFLOW_VAR"
          echo "Job scoped variable: $JOB_VAR"
          echo "Step scoped variable: $STEP_VAR"
        env:
          STEP_VAR: I_AM_STEP_SCOPED
  job2:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "In Job 2, Hello, World!"

  job3:
    needs: 
        - job1
        - job2
    runs-on: ubuntu-latest
    steps:
        - name: echo
          run: echo "In Job 3, Hello, World!"
  job4:
    needs: 
        - job3        
    runs-on: ubuntu-latest
    steps:
        - name: echo
          run: echo "In Job 4, Hello, World!"
      
    