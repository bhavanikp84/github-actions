
name: Hello World Workflow
run-name: added event in workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  #workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "Hello, World!"
      - name: script
        run: print("Hello, World!")
        shell: python
  job2:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "In Job 2, Hello, World!"

  job3:
    needs: 
        - job1
        - job2
    runs-on: ubuntu-latest
    steps:
        - name: echo
          run: echo "In Job 3, Hello, World!"
  job4:
    needs: 
        - job3        
    runs-on: ubuntu-latest
    steps:
        - name: echo
          run: echo "In Job 4, Hello, World!"
      
    