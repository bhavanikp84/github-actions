
name: Hello World Workflow
run-name: Hello World Workflow run

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "Hello, World!"
      - name: script
        run: print("Hello, World!")
        shell: python
  job2:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "In Job 2, Hello, World!"

  job3:
    needs: 
        - job1
        - job2
    runs-on: ubuntu-latest
    steps:
        - name: echo
          run: echo "In Job 3, Hello, World!"
  job4:
    needs: 
        - job3        
    runs-on: ubuntu-latest
    steps:
        - name: echo
          run: echo "In Job 4, Hello, World!"
      
    