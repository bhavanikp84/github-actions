name: Hello World Workflow

on:
  push:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-24.04
    steps:
      - name: Hello World Step
        run: echo "Hello, World!"
        shell: bash

  say-hello-inline-python:
    needs: hello-world
    runs-on: ubuntu-24.04
    steps:
      - name: Say Hello Inline Python
        run: |
          python -c "print('Hello from inline Python!')"
      - run : print("Hello from inline Python!")
        shell: python
      - run: echo "Hello from inline Python!"
        shell: bash

  say-hello-action:
    needs: say-hello-inline-python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/hello-world-javascript-action@v1
        with:
          who-to-greet: 'World'
