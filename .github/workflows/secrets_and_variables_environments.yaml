name: Secrets, Variables and Environments

run-name: secrets and environments

on:
  workflow_dispatch:
    
env:
  MY_NAME: "Bhavani"

jobs:
  staging-env:
    runs-on: ubuntu-24.04
    environment: staging
    env:
      EXAMPLE_REPO_SECRET: ${{ secrets.EXAMPLE_REPO_SECRET }}
      EXAMPLE_REPO_VARIABLE: ${{ vars.EXAMPLE_REPO_VARIABLE }}
      EXAMPLE_ENV_SECRET: ${{ secrets.EXAMPLE_ENV_SECRET }}
      EXAMPLE_ENV_VARIABLE: ${{ vars.EXAMPLE_ENV_VARIABLE }}

    steps:
      - name: Inspect values inside job
        run: |
          echo "Repo secret (masked): $EXAMPLE_REPO_SECRET"
          echo "Repo variable: $EXAMPLE_REPO_VARIABLE"
          echo "ENV secret(masked): $EXAMPLE_ENV_SECRET"
          echo "Env variable : $EXAMPLE_ENV_VARIABLE"
      
